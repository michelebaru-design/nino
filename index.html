<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <meta name="theme-color" content="#3a6ad9">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Agenda</title>
  <style>
    :root {
      --navy:#2a4ea8; --blue:#4a7dff; --ink:#1b2744; --muted:#667694; --bad:#e25563;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; }
    body {
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color:var(--ink); background:#e7eefc; overflow:hidden;
    }
    .app {
      max-width:480px; margin:0 auto; height:100%;
      display:flex; flex-direction:column;
      background: linear-gradient(#9ad0ff 0 80px, #ffe9b8 80px 250px, #e7eefc 250px);
      padding: calc(10px + var(--safe-t)) 12px calc(10px + var(--safe-b));
    }
    .weekgrid { display:block; }
    .col { display:none; }
    .col.on { display:block; }
    .colhead { display:none; }
    .pc-hint { display:none; }
    header { display:flex; justify-content:space-between; align-items:center; }
    .brand { font-weight:800; font-size:17px; letter-spacing:-.03em; }
    .brand span { color:#2a4ea8; }
    .navw { display:flex; align-items:center; gap:8px; margin:8px 0 2px; }
    .navw button {
      width:40px; height:40px; border-radius:14px; background:#fff; color:var(--navy);
      font-weight:800; font-size:22px; line-height:1; box-shadow:0 4px 10px rgba(42,78,168,.12);
    }
    .week {
      flex:1; width:auto !important; height:auto !important; min-height:40px;
      font-size:15px !important; font-weight:800; color:#143056;
      text-align:center; padding:8px 10px; border-radius:14px; background:#fff;
      line-height:1.2; box-shadow:0 4px 10px rgba(42,78,168,.12);
    }
    .hero { display:flex; align-items:flex-end; gap:2px; margin:0 0 6px; min-height:236px; }
    .nino-wrap { width:210px; flex:0 0 210px; }
    .nino { width:210px; height:236px; display:block; }
    .bubble {
      flex:1; background:#fff; border-radius:20px 20px 20px 8px;
      padding:12px 13px; min-height:92px; margin-bottom:36px;
      box-shadow:0 10px 24px rgba(42,78,168,.14); position:relative;
    }
    .bubble:before {
      content:""; position:absolute; left:-8px; bottom:34px;
      border:8px solid transparent; border-right-color:#fff; border-left:0;
    }
    .who { font-size:11px; font-weight:800; color:var(--blue); text-transform:uppercase; letter-spacing:.04em; }
    .say { margin:5px 0 0; font-size:15px; line-height:1.35; font-weight:650; }
    .say small { display:block; margin-top:6px; color:var(--muted); font-weight:500; font-size:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:8px; }
    .stat { background:#fff; border-radius:14px; padding:8px; text-align:center; }
    .stat b { display:block; font-size:18px; }
    .stat span { font-size:10px; color:var(--muted); font-weight:800; letter-spacing:.03em; }
    .actions { display:flex; gap:8px; margin-bottom:8px; }
    button { font:inherit; border:0; cursor:pointer; }
    .btn { flex:1; background:var(--blue); color:#fff; border-radius:14px; padding:12px 8px; font-weight:750; font-size:14px; }
    .btn.ghost { background:#fff; color:var(--navy); }
    .days { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:8px; }
    .day { background:#fff; border-radius:13px; padding:7px 0 6px; text-align:center; }
    .day.on { background:var(--navy); color:#fff; }
    .day.today:not(.on) { outline:2px solid #8eb0ff; }
    .day .dn { font-size:10px; font-weight:800; opacity:.65; }
    .day .dd { font-size:14px; font-weight:800; }
    .day .dot { width:5px; height:5px; border-radius:50%; margin:4px auto 0; background:transparent; }
    .day.has .dot { background:#ffd15a; }
    .day.on.has .dot { background:#fff; }
    .day.blocked-day .dot { background:#e25563; }
    .day.on.blocked-day .dot { background:#ffb3b3; }
    .day.blocked-day:not(.on) { outline:2px solid #e25563; }
    .board { flex:1; overflow:auto; background:#fff; border-radius:20px; padding:12px 10px 16px; }
    .empty { text-align:center; color:var(--muted); padding:36px 12px; font-weight:600; }
    .row { display:grid; grid-template-columns:52px 14px 1fr; gap:0 8px; min-height:72px; margin-bottom:4px; }
    .hh {
      font-weight:800; color:var(--navy); font-size:12px; padding-top:4px; line-height:1.35;
      letter-spacing:-0.02em;
    }
    .rail { position:relative; }
    .rail:before { content:""; position:absolute; left:6px; top:14px; bottom:-12px; width:2px; background:#d0dbea; }
    .row:last-child .rail:before { display:none; }
    .dotline {
      width:14px; height:14px; border-radius:50%; background:#4a7dff;
      border:3px solid #d7e6ff; margin-top:4px; position:relative; z-index:1;
      box-shadow:0 0 0 2px #fff;
    }
    .dotline.scadenza { background:#e08a16; border-color:#ffe0bd; }
    .dotline.call { background:#1f9d6a; border-color:#cfeedf; }
    .dotline.task { background:#6b3cc3; border-color:#eadbff; }
    .dotline.assenza { background:#c43c3c; border-color:#ffc9c9; }
    .dotline.habit { background:#3a9ad9; border-color:#c5e5f8; }
    .card {
      background:#fff;
      border-radius:14px;
      padding:12px 12px 12px 14px;
      margin-bottom:10px;
      border:1px solid #e4ebf5;
      border-left:5px solid #4a7dff;
      box-shadow:0 2px 8px rgba(42,78,168,.06);
    }
    .card.type-riunione { border-left-color:#3a6ad9; background:#f7faff; }
    .card.type-call { border-left-color:#1f9d6a; background:#f3fbf7; }
    .card.type-scadenza { border-left-color:#e08a16; background:#fffaf3; }
    .card.type-task { border-left-color:#6b3cc3; background:#faf7ff; }
    .card.type-assenza { border-left-color:#c43c3c; background:#fff5f5; }
    .card.type-habit { border-left-color:#3a9ad9; background:#f3f9fd; }
    .now .card {
      outline:2px solid var(--blue);
      box-shadow:0 4px 14px rgba(74,125,255,.2);
    }
    .card.rip { /* ricorrente: leggero accento */ }
    .card.urg {
      border-left-color:#d64545;
      background:#fff0f0;
      box-shadow:0 2px 8px rgba(214,69,69,.12);
    }
    .card.done {
      background:#f0faf3 !important;
      border-color:#c5e8d0;
      border-left-color:#1f9d6a;
      opacity:.85;
    }
    .card.blocked {
      background:#fff0f0 !important;
      border-left-color:#c43c3c;
      outline:2px solid #e25563;
    }
    .card.conflict {
      background:#fff6eb !important;
      border-left-color:#e08a16;
      outline:2px solid #e08a16;
    }
    .card.assenza { background:#fff5f5; border-left-color:#c43c3c; }
    .now .card.rip { outline-color:#e0b12d; }
    .now .card.urg { outline-color:#d64545; }
    .now .card.done { outline-color:#1f9d6a; }
    .now .card.blocked { outline-color:#c43c3c; }
    .now .card.conflict { outline-color:#e08a16; }
    .dotline.rip { background:#e0b12d; border-color:#ffe9a0; }
    .dotline.urg { background:#d64545; border-color:#ffb3b3; }
    .dotline.done { background:#1f9d6a; border-color:#b5ebc6; }
    .dotline.blocked { background:#c43c3c; border-color:#ffb3b3; }
    .dotline.conflict { background:#e08a16; border-color:#ffe0bd; }
    .t-rip { background:#fff0c2; color:#7a5c00; }
    .t-urg { background:#ffc9c9; color:#9b1c1c; }
    .t-done { background:#b5ebc6; color:#0f7a4a; }
    .t-blocked { background:#ffc9c9; color:#9b1c1c; }
    .t-conflict { background:#ffe0bd; color:#8a4b00; }
    .card.done .title { text-decoration:line-through; opacity:.7; }
    .card.blocked .title { color:#9b1c1c; }
    .title {
      font-weight:750; font-size:16px; line-height:1.3; color:var(--ink);
      margin:0 0 2px; letter-spacing:-0.02em;
    }
    .meta {
      color:var(--muted); font-size:12px; margin-top:6px;
      display:flex; flex-wrap:wrap; align-items:center; gap:4px 2px;
      line-height:1.4;
    }
    .tag {
      display:inline-block; font-size:10px; font-weight:800;
      padding:3px 8px; border-radius:999px; margin-right:2px;
      letter-spacing:.02em;
    }
    .t-riunione { background:#dce8ff; color:#1d4fbf; }
    .t-scadenza { background:#ffe0c2; color:#a04a00; }
    .t-call { background:#d4f3e4; color:#0b6b40; }
    .t-task { background:#e8dcff; color:#5a2aad; }
    .t-assenza { background:#ffd0d0; color:#9b1c1c; }
    .t-habit { background:#d6eefc; color:#1a5f9e; }
    .rep { font-size:10px; font-weight:800; color:var(--blue); }
    .acts {
      display:flex; flex-wrap:wrap; gap:4px;
      margin:0 0 8px; padding-bottom:8px;
      border-bottom:1px solid #eef2f8;
    }
    .del, .skip {
      height:28px; border-radius:9px; background:#f4f7fc;
      font-size:11px; font-weight:800; padding:0 9px;
      border:1px solid #e4ebf5;
    }
    .del { color:var(--bad); width:28px; padding:0; font-size:15px; background:#fff5f5; border-color:#ffd0d0; }
    .skip { color:var(--navy); }
    .edit { color:var(--navy); }
    .nowbar { grid-column:1 / -1; display:flex; align-items:center; gap:8px; color:#c43c3c; font-size:11px; font-weight:800; margin:2px 0 8px; }
    .nowbar i { flex:1; height:2px; background:#f3c4c4; display:block; }
    .sheet { position:fixed; inset:0; background:rgba(8,16,32,.45); display:none; align-items:flex-end; justify-content:center; z-index:20; }
    .sheet.show { display:flex; }
    .panel { width:min(480px,100%); background:#fff; border-radius:24px 24px 0 0; padding:16px 16px calc(16px + var(--safe-b)); max-height:92%; overflow:auto; }
    .grab { width:40px; height:5px; background:#d7deea; border-radius:99px; margin:0 auto 12px; }
    h2 { margin:0 0 8px; font-size:18px; }
    label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 6px; }
    input, select, textarea { width:100%; font:inherit; border:1.5px solid #dbe4f3; border-radius:14px; padding:12px; background:#f7faff; outline:none; }
    textarea { min-height:64px; resize:none; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .types, .reps { display:grid; gap:6px; }
    .types { grid-template-columns:repeat(3,1fr); }
    .reps { grid-template-columns:repeat(4,1fr); }
    .chip { background:#f3f6fb; border-radius:12px; padding:9px 4px; font-size:11px; font-weight:800; }
    .chip.on { background:var(--navy); color:#fff; }
    .urgchip.on { background:#d64545; }
    .save { width:100%; margin-top:14px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center; }
    .toolbar .chip { padding:7px 10px; font-size:11px; }
    .searchbox { flex:1; min-width:120px; padding:8px 12px; border:1.5px solid #dbe4f3; border-radius:12px; background:#fff; font:inherit; font-size:13px; }
    .loadbar-wrap { background:#fff; border-radius:12px; padding:8px 10px; margin-bottom:8px; }
    .loadbar-label { display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:5px; }
    .loadbar { height:8px; background:#e8eef8; border-radius:99px; overflow:hidden; }
    .loadbar > i { display:block; height:100%; background:var(--blue); border-radius:99px; transition:width .25s; }
    .loadbar.high > i { background:#e08a16; }
    .loadbar.full > i { background:#e25563; }
    .card.conflict { background:#ffe8d0; outline:2px solid #e08a16; }
    .now .card.conflict { outline-color:#c97800; background:#ffd9b0; }
    .dotline.conflict { background:#e08a16; border-color:#ffe0bd; }
    .t-conflict { background:#ffe0bd; color:#8a4b00; }
    .t-habit { background:#e0f0ff; color:#1a5f9e; }
    .dotline.habit { background:#3a9ad9; border-color:#c5e5f8; }
    .card.habit { background:#eef6fc; }
    .habits-box {
      background:#f3f9fd; border-radius:14px; padding:12px;
      margin-bottom:12px; border:1px solid #d6eefc; border-left:5px solid #3a9ad9;
    }
    .habits-box h3 { margin:0 0 10px; font-size:13px; color:#1a5f9e; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
    .habit-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #e0f0fa; }
    .habit-row:last-child { border-bottom:0; }
    .habit-row input[type=checkbox] { width:22px; height:22px; accent-color:#3a9ad9; flex-shrink:0; }
    .habit-row span { font-size:15px; font-weight:650; color:var(--ink); }
    .habit-row.done span { text-decoration:line-through; opacity:.55; }
    .habit-row .hacts { margin-left:auto; display:flex; gap:4px; }
    .view-toggle { display:flex; gap:4px; margin-bottom:8px; }
    .view-toggle .chip { flex:1; text-align:center; }
    .conflict-warn { background:#fff3e0; color:#8a4b00; border-radius:12px; padding:10px; font-size:13px; font-weight:650; margin:10px 0; display:none; }
    .conflict-warn.show { display:block; }
    .stats-panel { font-size:13px; line-height:1.5; }
    .stats-panel b { color:var(--navy); }
    .mode-today .days { display:none; }
    .mode-today .weekgrid { display:block !important; }
    .mode-today .col { display:none !important; }
    .mode-today .col.on { display:flex !important; flex-direction:column; }
    .mode-today .colhead { display:block; }
    .mode-today .pc-hint { display:none; }
    .bob { animation:bob 2.8s ease-in-out infinite; transform-origin:50% 100%; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    .blink { animation:blink 4.2s infinite; }
    @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 93%{transform:scaleY(.08)} }
    .talking .mouth { animation:talk .24s infinite alternate; }
    @keyframes talk { from{transform:scaleY(.4)} to{transform:scaleY(1.25)} }

    @media (min-width: 980px) {
      body { overflow:auto; background:#dce8fb; }
      .app {
        max-width:1360px; height:100%;
        background: linear-gradient(#9ad0ff 0 56px, #e7eefc 56px);
        padding: 14px 16px 16px;
      }
      header { margin-bottom: 2px; }
      .hero { min-height:auto; align-items:center; margin:0 0 8px; }
      .nino-wrap { width:120px; flex:0 0 120px; }
      .nino { width:120px; height:134px; }
      .bubble { min-height:72px; margin-bottom:0; }
      .stats { max-width:420px; }
      .toprow { display:grid; grid-template-columns: 1fr 280px; gap:10px; align-items:end; }
      .days { display:none; }
      .board { padding:10px; }
      .weekgrid {
        display:grid; grid-template-columns:repeat(7, minmax(0,1fr));
        gap:8px; min-height:100%;
      }
      .col { display:flex; flex-direction:column; background:#f4f7fd; border-radius:16px; min-height:420px; padding:8px 7px 10px; }
      .col.on { outline:2px solid var(--blue); background:#eef4ff; }
      .col.today { outline:2px solid #8eb0ff; }
      .colhead { display:block; text-align:center; margin-bottom:8px; cursor:pointer; }
      .colhead .dn { font-size:11px; font-weight:800; color:var(--muted); }
      .colhead .dd { font-size:18px; font-weight:800; }
      .col .row { grid-template-columns:48px 1fr; gap:6px; min-height:auto; }
      .col .hh { font-size:11px; }
      .col .rail { display:none; }
      .col .card { margin-bottom:8px; padding:10px 10px 10px 12px; border-left-width:4px; }
      .col .title { font-size:14px; padding-right:0; }
      .col .acts { margin:0 0 6px; padding-bottom:6px; }
      .col .acts { float:none; display:flex; flex-wrap:wrap; margin:0 0 4px; }
      .col .acts button { height:24px; font-size:10px; }
      .col .del { width:24px; }
      .pc-hint { display:block; font-size:12px; color:var(--muted); font-weight:600; margin:0 0 6px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Agenda</div>
    </header>
    <div class="navw">
      <button type="button" id="prevW" aria-label="Settimana precedente">‹</button>
      <button type="button" class="week" id="weekLabel"></button>
      <button type="button" id="nextW" aria-label="Settimana successiva">›</button>
    </div>
    <section class="hero">
      <div class="nino-wrap bob" id="ninoWrap">
        <svg class="nino" viewBox="0 0 260 300" aria-hidden="true">
          <ellipse cx="128" cy="286" rx="62" ry="9" fill="#f2c56a" opacity=".45"/>
          <!-- feet -->
          <ellipse cx="108" cy="268" rx="18" ry="10" fill="#fff6c2"/>
          <ellipse cx="150" cy="268" rx="18" ry="10" fill="#fff6c2"/>
          <ellipse cx="108" cy="266" rx="11" ry="6" fill="#ffd38a"/>
          <ellipse cx="150" cy="266" rx="11" ry="6" fill="#ffd38a"/>
          <!-- tiny work body -->
          <path d="M88 188 C90 168 104 160 130 160 C156 160 170 168 172 188 L178 238 C178 250 158 258 130 258 C102 258 82 250 82 238 Z" fill="#5aa6ff"/>
          <path d="M114 168 L130 214 L146 168 Z" fill="#fff"/>
          <path d="M130 174 L124 198 L130 194 L136 198 Z" fill="#ff6b7a"/>
          <rect x="68" y="184" width="22" height="48" rx="12" fill="#5aa6ff"/>
          <rect x="170" y="184" width="22" height="48" rx="12" fill="#5aa6ff"/>
          <circle cx="79" cy="234" r="11" fill="#ffe08a"/>
          <circle cx="181" cy="234" r="11" fill="#ffe08a"/>
          <!-- tail -->
          <path d="M176 230 Q210 210 214 176" fill="none" stroke="#6eb0ff" stroke-width="10" stroke-linecap="round"/>
          <circle cx="214" cy="170" r="9" fill="#ffe08a"/>
          <!-- ears -->
          <path d="M62 78 L78 28 L108 78 Z" fill="#6eb0ff"/>
          <path d="M152 78 L182 28 L198 78 Z" fill="#6eb0ff"/>
          <path d="M76 74 L86 44 L102 74 Z" fill="#ffd0de"/>
          <path d="M158 74 L174 44 L184 74 Z" fill="#ffd0de"/>
          <!-- head -->
          <ellipse cx="130" cy="118" rx="78" ry="74" fill="#7bbcff"/>
          <ellipse cx="130" cy="138" rx="58" ry="42" fill="#fff7e8"/>
          <!-- huge eyes -->
          <g class="blink" style="transform-origin:96px 112px">
            <ellipse cx="96" cy="114" rx="26" ry="28" fill="#fff"/>
            <ellipse cx="98" cy="118" rx="16" ry="18" fill="#2a3d7a"/>
            <ellipse cx="98" cy="120" rx="10" ry="11" fill="#3ec2ff"/>
            <circle cx="90" cy="108" r="8" fill="#fff"/>
            <circle cx="104" cy="122" r="3.2" fill="#fff"/>
          </g>
          <g class="blink" style="transform-origin:164px 112px">
            <ellipse cx="164" cy="114" rx="26" ry="28" fill="#fff"/>
            <ellipse cx="162" cy="118" rx="16" ry="18" fill="#2a3d7a"/>
            <ellipse cx="162" cy="120" rx="10" ry="11" fill="#3ec2ff"/>
            <circle cx="154" cy="108" r="8" fill="#fff"/>
            <circle cx="168" cy="122" r="3.2" fill="#fff"/>
          </g>
          <!-- brows + blush -->
          <path d="M74 86 Q96 78 114 88" fill="none" stroke="#2a3d7a" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M146 88 Q164 78 186 86" fill="none" stroke="#2a3d7a" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse cx="72" cy="142" rx="14" ry="8" fill="#ff9db0" opacity=".8"/>
          <ellipse cx="188" cy="142" rx="14" ry="8" fill="#ff9db0" opacity=".8"/>
          <!-- tiny nose + tender mouth -->
          <ellipse cx="130" cy="142" rx="6" ry="4.5" fill="#ff8aa0"/>
          <path class="mouth" d="M118 156 Q130 168 142 156" fill="none" stroke="#2a3d7a" stroke-width="3.4" stroke-linecap="round"/>
          <!-- big sweat drop -->
          <path d="M208 70 C208 70 230 102 214 118 C204 128 192 118 198 100 C202 88 208 70 208 70 Z" fill="#bfe9ff" stroke="#7ec8f0" stroke-width="3"/>
          <ellipse cx="208" cy="96" rx="4" ry="6" fill="#fff" opacity=".8"/>
          <!-- whiskers -->
          <path d="M54 138 H20 M56 148 H22" stroke="#2a3d7a" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
          <path d="M206 138 H240 M204 148 H238" stroke="#2a3d7a" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
        </svg>
      </div>
      <div class="bubble">
        <div class="who">Agenda</div>
        <div class="say" id="speech">Guardo il calendario…</div>
      </div>
    </section>
    <div class="stats">
      <div class="stat"><b id="sToday">0</b><span id="sTodayL">GIORNO</span></div>
      <div class="stat"><b id="sWeek">0</b><span>SETTIMANA</span></div>
      <div class="stat"><b id="sDead">0</b><span>SCADENZE</span></div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="talkBtn">Briefing</button>
      <button type="button" class="btn ghost" id="addBtn">+ Impegno</button>
      <button type="button" class="btn ghost" id="statsBtn" style="flex:0.6">Stats</button>
    </div>
    <div class="view-toggle">
      <button type="button" class="chip on" id="viewWeek" data-view="week">Settimana</button>
      <button type="button" class="chip" id="viewToday" data-view="today">Solo oggi</button>
    </div>
    <div class="toolbar">
      <input type="search" class="searchbox" id="searchBox" placeholder="Cerca titolo o nota…">
    </div>
    <div class="toolbar" id="filters">
      <button type="button" class="chip on" data-filter="all">Tutti</button>
      <button type="button" class="chip" data-filter="riunione">Riunioni</button>
      <button type="button" class="chip" data-filter="call">Call</button>
      <button type="button" class="chip" data-filter="scadenza">Scadenze</button>
      <button type="button" class="chip" data-filter="task">Task</button>
      <button type="button" class="chip" data-filter="assenza">Assenze</button>
      <button type="button" class="chip" data-filter="habit">Abitudini</button>
    </div>
    <div class="loadbar-wrap" id="loadWrap">
      <div class="loadbar-label"><span id="loadText">0h / 8h · 8–12 · 13–17</span><span id="loadPct">0%</span></div>
      <div class="loadbar" id="loadBar"><i id="loadFill" style="width:0%"></i></div>
    </div>
    <div class="days" id="days"></div>
    <div class="board" id="list"></div>
  </div>
  <div class="sheet" id="sheet">
    <form class="panel" id="form" action="javascript:void(0)">
      <div class="grab"></div>
      <h2 id="formTitle">Impegno di lavoro</h2>
      <label>Tipo</label>
      <div class="types" id="types">
        <button type="button" class="chip on" data-type="riunione">Riunione</button>
        <button type="button" class="chip" data-type="call">Call</button>
        <button type="button" class="chip" data-type="scadenza">Scadenza</button>
        <button type="button" class="chip" data-type="task">Task</button>
        <button type="button" class="chip" data-type="assenza">Assenza</button>
        <button type="button" class="chip" data-type="habit">Abitudine</button>
      </div>
      <label>Priorità</label>
      <div class="types" id="prio">
        <button type="button" class="chip on" data-urg="0">Normale</button>
        <button type="button" class="chip urgchip" data-urg="1">Urgente</button>
      </div>
      <label>Cosa</label>
      <input id="fTitle" required maxlength="90" placeholder="Es. standup, report, call cliente">
      <label>Giorno</label>
      <select id="fDay"></select>
      <div class="row2" id="timeRow">
        <div><label>Inizio</label><input id="fTime" type="time" value="09:00" required></div>
        <div><label>Fine</label><input id="fTimeEnd" type="time" value="10:00" required></div>
      </div>
      <div class="conflict-warn" id="conflictWarn"></div>
      <label>Ricorrenza</label>
      <div class="reps" id="reps">
        <button type="button" class="chip on" data-rep="none">Solo quel giorno</button>
        <button type="button" class="chip" data-rep="weekly">Ogni settimana</button>
        <button type="button" class="chip" data-rep="weekdays">Lun-Ven</button>
        <button type="button" class="chip" data-rep="daily">Tutti i giorni</button>

      <label>Nota</label>
      <textarea id="fNote" maxlength="160" placeholder="Sala, link, persone…"></textarea>
      <button class="btn save" type="submit" id="saveBtn">Salva</button>
    </form>
  </div>
  <div class="sheet" id="doneSheet">
    <div class="panel">
      <div class="grab"></div>
      <h2>Segna come fatto</h2>
      <label>Esito (opzionale)</label>
      <textarea id="doneNote" maxlength="120" placeholder="Es. chiuso con cliente, rimandato, ok…"></textarea>
      <button class="btn save" type="button" id="doneConfirm">Conferma fatto</button>
      <button class="btn ghost save" type="button" id="doneCancel" style="margin-top:8px;background:#f3f6fb;color:var(--navy)">Annulla</button>
    </div>
  </div>
  <div class="sheet" id="statsSheet">
    <div class="panel">
      <div class="grab"></div>
      <h2>Statistiche settimana</h2>
      <div class="stats-panel" id="statsBody"></div>
      <button class="btn save" type="button" id="statsClose">Chiudi</button>
    </div>
  </div>
<script>
(function () {
  var DAYS = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
  var DAYS_LONG = ["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
  var LABELS = { riunione:"Riunione", call:"Call", scadenza:"Scadenza", task:"Task", assenza:"Assenza", habit:"Abitudine" };
  var REPS = { none:"una tantum", weekly:"ogni settimana", weekdays:"lun-ven", daily:"tutti i giorni" };
  var KEY = "nino-lavoro-v5";
  var WORK_START = "08:00";
  var WORK_END = "17:00";
  var WORK_HOURS = 8; // 08–12 + 13–17

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?"0":"")+n; }
  function addHour(hhmm){
    var p = String(hhmm||"09:00").split(":");
    var h = Number(p[0])||9, m = Number(p[1])||0;
    h = (h + 1) % 24;
    return pad(h)+":"+pad(m);
  }
  function toMinutes(hhmm){
    var p = String(hhmm||"00:00").split(":");
    return (Number(p[0])||0)*60 + (Number(p[1])||0);
  }
  function timeRange(x){
    if(x.type === "habit") return "Abit.";
    var s = x.time || "09:00";
    var e = x.timeEnd || addHour(s);
    if(s === e) return s;
    // due righe per non spezzare male l'orario
    return s+"\n"+e;
  }
  function timeRangeInline(x){
    if(x.type === "habit") return "Abit.";
    var s = x.time || "09:00";
    var e = x.timeEnd || addHour(s);
    return s === e ? s : s+"–"+e;
  }
  function durationHours(x){
    if(x.type === "habit") return 0;
    var s = toMinutes(x.time || "09:00");
    var e = toMinutes(x.timeEnd || addHour(x.time || "09:00"));
    if(e < s) e += 24*60;
    return (e - s) / 60;
  }
  function isBlocker(x){
    if(!x) return false;
    if(x.type === "assenza") return true;
    if(x.type === "habit") return false;
    return durationHours(x) >= 8;
  }
  function overlaps(a, b){
    if(a.type==="habit" || b.type==="habit") return false;
    if(a.type==="assenza" || b.type==="assenza") return false;
    var as = toMinutes(a.time||"09:00"), ae = toMinutes(a.timeEnd||addHour(a.time||"09:00"));
    var bs = toMinutes(b.time||"09:00"), be = toMinutes(b.timeEnd||addHour(b.time||"09:00"));
    if(ae < as) ae += 24*60;
    if(be < bs) be += 24*60;
    return as < be && bs < ae;
  }
  function todayIndex(){ var d=new Date().getDay(); return d===0?6:d-1; }
  function thisMonday(){
    var d=new Date(); var day=d.getDay();
    d.setDate(d.getDate()+(day===0?-6:1-day)); d.setHours(12,0,0,0); return d;
  }
  function mondayOf(){
    var d=thisMonday(); d.setDate(d.getDate()+weekOff*7); return d;
  }
  function dateFor(i){ var m=mondayOf(); m.setDate(m.getDate()+i); return m; }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayIso(){ var d=new Date(); return iso(d); }
  function load(){ try{ var x=JSON.parse(localStorage.getItem(KEY)||"[]"); return x instanceof Array?x:[]; }catch(e){ return []; } }
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function nowHHMM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
  function skipped(item, dateStr){
    var s=item.skips||[]; for(var i=0;i<s.length;i++) if(s[i]===dateStr) return true; return false;
  }
  function isDone(item, dateStr){
    var s=item.doneDates||[]; for(var i=0;i<s.length;i++) if(s[i]===dateStr) return true; return false;
  }
  function toggleDate(arr, dateStr){
    arr = arr || [];
    var i=arr.indexOf(dateStr);
    if(i===-1) arr.push(dateStr); else arr.splice(i,1);
    return arr;
  }
  function getDoneNote(item, dateStr){
    var n = item.doneNotes || {};
    return n[dateStr] || "";
  }
  function setDoneNote(item, dateStr, note){
    if(!item.doneNotes) item.doneNotes = {};
    if(note) item.doneNotes[dateStr] = note;
    else delete item.doneNotes[dateStr];
  }

  var weekOff = 0;
  var selected = todayIndex();
  var items = load();
  var pickType = "riunione";
  var pickRep = "none";
  var pickUrg = false;
  var editId = null;
  var viewMode = "week";
  var typeFilter = "all";
  var searchQ = "";
  var pendingDone = null;

  function happensOn(item, dayIdx, dateStr){
    if(skipped(item, dateStr)) return false;
    var r = item.rep || "none";
    if(r==="daily") return true;
    if(r==="weekdays") return dayIdx <= 4;
    if(r==="weekly") return Number(item.weekday) === dayIdx;
    return item.date === dateStr;
  }
  function ofDay(dayIdx){
    var dateStr = iso(dateFor(dayIdx));
    return items.filter(function(x){ return happensOn(x, dayIdx, dateStr); })
      .sort(function(a,b){
        if(a.type==="habit" && b.type!=="habit") return 1;
        if(b.type==="habit" && a.type!=="habit") return -1;
        return String(a.time||"").localeCompare(String(b.time||""));
      });
  }
  function ofDayFiltered(dayIdx){
    var rows = ofDay(dayIdx);
    if(typeFilter !== "all") rows = rows.filter(function(x){ return x.type === typeFilter; });
    if(searchQ){
      var q = searchQ.toLowerCase();
      rows = rows.filter(function(x){
        return (x.title||"").toLowerCase().indexOf(q)!==-1 || (x.note||"").toLowerCase().indexOf(q)!==-1;
      });
    }
    return rows;
  }
  function dayHasBlocker(dayIdx){
    var rows = ofDay(dayIdx);
    for(var i=0;i<rows.length;i++) if(isBlocker(rows[i])) return true;
    return false;
  }
  function hasConflict(item, dayIdx, excludeId){
    var rows = ofDay(dayIdx);
    for(var i=0;i<rows.length;i++){
      if(excludeId && rows[i].id === excludeId) continue;
      if(overlaps(item, rows[i])) return rows[i];
    }
    return null;
  }
  function dayLoadHours(dayIdx){
    var rows = ofDay(dayIdx), h = 0;
    for(var i=0;i<rows.length;i++){
      if(rows[i].type === "habit") continue;
      h += durationHours(rows[i]);
    }
    return Math.round(h * 10) / 10;
  }
  function uniqueWeekCount(){ var n=0; for(var i=0;i<7;i++) n += ofDay(i).filter(function(x){return x.type!=="habit";}).length; return n; }
  function weekDead(){
    var n=0; for(var i=0;i<7;i++) ofDay(i).forEach(function(x){ if(x.type==="scadenza") n++; }); return n;
  }
  function isCurrentWeek(){ return weekOff===0; }
  function viewingToday(){ return isCurrentWeek() && selected===todayIndex(); }

  function phrase(){
    var rows=ofDay(selected), weekN=uniqueWeekCount();
    var timed = rows.filter(function(x){ return x.type !== "habit"; });
    var dayName=DAYS_LONG[selected];
    var when = viewingToday() ? "Oggi" : (DAYS_LONG[selected].charAt(0).toUpperCase()+dayName.slice(1));
    if(weekOff===1) when = "Il prossimo "+dayName;
    if(weekOff>1) when = dayName+" tra "+weekOff+" settimane";
    if(weekOff===-1) when = "Il "+dayName+" scorso";
    if(weekOff<-1) when = dayName+" di "+(-weekOff)+" settimane fa";

    var hasBlock = dayHasBlocker(selected);
    var blockedN = 0;
    if(hasBlock) for(var bi=0;bi<rows.length;bi++) if(rows[bi].rep && rows[bi].rep!=="none" && !isBlocker(rows[bi])) blockedN++;

    if(!items.length) return { main:"Nessun impegno in archivio. Ne mettiamo uno anche tra due settimane?", sub:"Usa le frecce in alto per cambiare settimana." };
    if(hasBlock && blockedN) return { main: when+" sei fuori: i ricorrenti sono in pausa.", sub: blockedN+" impegni ricorrenti risultano bloccati." };
    if(!timed.length) return { main: when+" giornata libera, bravo.", sub: weekN? (weekN+" impegni in questa settimana."):"Questa settimana è libera." };
    if(timed.length >= 5) return { main: when+" giornata intensa, respira. Hai "+timed.length+" impegni.", sub: timed.map(function(x){ return timeRangeInline(x)+" "+x.title; }).join(", ")+"." };
    if(timed.length===1) return { main: when+" "+timeRangeInline(timed[0])+": "+timed[0].title+".", sub: (LABELS[timed[0].type]||"")+(timed[0].rep && timed[0].rep!=="none"?" · "+REPS[timed[0].rep]:"") };
    return { main: when+" hai "+timed.length+" impegni, dal "+timed[0].time+" al "+(timed[timed.length-1].timeEnd||timed[timed.length-1].time)+".", sub: timed.map(function(x){ return timeRangeInline(x)+" "+x.title; }).join(", ")+"." };
  }

  function nearestId(rows){
    if(!viewingToday() || !rows.length) return null;
    var now=nowHHMM(), next=null;
    for(var i=0;i<rows.length;i++){
      if(rows[i].type==="habit") continue;
      if(rows[i].time>=now){ next=rows[i].id; break; }
    }
    if(next) return next;
    for(var j=rows.length-1;j>=0;j--) if(rows[j].type!=="habit") return rows[j].id;
    return null;
  }

  var MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  function fmtRange(){
    var a=dateFor(0), b=dateFor(6);
    var left = a.getDate()+" "+MESI[a.getMonth()];
    var right = b.getDate()+" "+MESI[b.getMonth()];
    if(weekOff===0) return "Questa settimana\n"+left+" – "+right;
    if(weekOff===1) return "Prossima settimana\n"+left+" – "+right;
    if(weekOff===-1) return "Settimana scorsa\n"+left+" – "+right;
    if(weekOff>1) return "Tra "+weekOff+" settimane\n"+left+" – "+right;
    return (-weekOff)+" settimane fa\n"+left+" – "+right;
  }

  function updateLoadBar(){
    var h = dayLoadHours(selected);
    var pct = Math.min(100, Math.round((h / WORK_HOURS) * 100));
    $("loadText").textContent = h + "h / " + WORK_HOURS + "h · 8–12 · 13–17";
    $("loadPct").textContent = pct + "%";
    $("loadFill").style.width = pct + "%";
    var bar = $("loadBar");
    bar.className = "loadbar" + (pct >= 100 ? " full" : (pct >= 75 ? " high" : ""));
  }

  function render(){
    document.querySelector(".app").className = "app" + (viewMode==="today" ? " mode-today" : "");
    if(viewMode === "today" && isCurrentWeek()) selected = todayIndex();
    $("weekLabel").innerText = fmtRange();
    var timedCount = ofDay(selected).filter(function(x){return x.type!=="habit";}).length;
    $("sToday").textContent = timedCount;
    $("sTodayL").textContent = viewingToday() ? "OGGI" : DAYS[selected].toUpperCase();
    $("sWeek").textContent = uniqueWeekCount();
    $("sDead").textContent = weekDead();
    var p=phrase();
    $("speech").innerHTML = p.main+(p.sub?"<small>"+esc(p.sub)+"</small>":"");
    var days="", curIso=todayIso();
    for(var i=0;i<7;i++){
      var d=dateFor(i), isToday=iso(d)===curIso;
      var blk = dayHasBlocker(i);
      days += '<button type="button" class="day'+(i===selected?" on":"")+(ofDay(i).length?" has":"")+(isToday?" today":"")+(blk?" blocked-day":"")+'" data-day="'+i+'"><div class="dn">'+DAYS[i]+'</div><div class="dd">'+d.getDate()+'</div><div class="dot"></div></button>';
    }
    $("days").innerHTML=days;
    $("list").innerHTML = buildWeekBoard();
    updateLoadBar();
    $("viewWeek").className = "chip"+(viewMode==="week"?" on":"");
    $("viewToday").className = "chip"+(viewMode==="today"?" on":"");
  }

  function cardHtml(x, dayIdx){
    var dateStr = iso(dateFor(dayIdx));
    var recurring = x.rep && x.rep!=="none";
    var urg = !!x.urgente || x.type==="scadenza";
    var done = isDone(x, dateStr);
    var blocked = !done && recurring && !isBlocker(x) && dayHasBlocker(dayIdx);
    var conflict = !done && !blocked && x.type!=="habit" && hasConflict(x, dayIdx, x.id);
    var tone = done ? "done" : (blocked ? "blocked" : (conflict ? "conflict" : (x.type==="assenza" ? "assenza" : (x.type==="habit" ? "habit" : (urg ? "urg" : (recurring ? "rip" : ""))))));
    var isTodayCol = iso(dateFor(dayIdx))===todayIso();
    var focus = isTodayCol ? nearestId(ofDay(dayIdx)) : null;
    var range = timeRange(x).replace(/\n/g,"<br>");
    var doneNote = getDoneNote(x, dateStr);
    return '<div class="row'+(focus===x.id?" now":"")+'"><div class="hh">'+range+'</div><div class="rail"><div class="dotline '+esc(x.type)+(tone?" "+tone:"")+'"></div></div><div class="card type-'+esc(x.type)+(tone?" "+tone:"")+'">'+
      '<div class="acts">'+
      '<button type="button" class="skip edit" data-day="'+dayIdx+'" data-done="'+esc(x.id)+'">'+(done?"Annulla":"Fatto")+'</button>'+
      '<button type="button" class="skip edit" data-day="'+dayIdx+'" data-edit="'+esc(x.id)+'">Modifica</button>'+
      '<button type="button" class="skip" data-day="'+dayIdx+'" data-dup="'+esc(x.id)+'">Copia</button>'+
      (recurring||x.type!=="habit"?'<button type="button" class="skip" data-day="'+dayIdx+'" data-snooze="'+esc(x.id)+'">Rimanda</button>':'')+
      (recurring?'<button type="button" class="skip" data-day="'+dayIdx+'" data-skip="'+esc(x.id)+'">Salta</button>':'')+
      '<button type="button" class="del" data-del="'+esc(x.id)+'">×</button></div>'+
      '<div class="title">'+esc(x.title)+'</div><div class="meta"><span class="tag t-'+esc(x.type)+'">'+esc(LABELS[x.type]||x.type)+'</span>'+
      (done?'<span class="tag t-done">Fatto</span>':'')+
      (blocked?'<span class="tag t-blocked">Bloccato</span>':'')+
      (conflict?'<span class="tag t-conflict">Conflitto</span>':'')+
      (urg && !done && !blocked?'<span class="tag t-urg">Urgente</span>':'')+
      (recurring?'<span class="tag t-rip">'+esc(REPS[x.rep])+'</span>':'')+
      (x.note?'<span style="display:block;width:100%;margin-top:4px;color:#5a6b85;font-weight:500">'+esc(x.note)+'</span>':'')+
      (doneNote?'<span style="display:block;width:100%;margin-top:2px;color:#0f7a4a;font-weight:650">✓ '+esc(doneNote)+'</span>':'')+
      '</div></div></div>';
  }

  function habitsHtml(dayIdx){
    var rows = ofDayFiltered(dayIdx).filter(function(x){ return x.type==="habit"; });
    if(!rows.length) return "";
    var dateStr = iso(dateFor(dayIdx));
    var html = '<div class="habits-box"><h3>Abitudini</h3>';
    for(var i=0;i<rows.length;i++){
      var x = rows[i];
      var done = isDone(x, dateStr);
      html += '<div class="habit-row'+(done?" done":"")+'">'+
        '<input type="checkbox" data-day="'+dayIdx+'" data-habit="'+esc(x.id)+'"'+(done?" checked":"")+'>'+
        '<span>'+esc(x.title)+'</span>'+
        '<div class="hacts">'+
        '<button type="button" class="skip edit" data-day="'+dayIdx+'" data-edit="'+esc(x.id)+'" style="height:24px;font-size:10px">Mod</button>'+
        '<button type="button" class="del" data-del="'+esc(x.id)+'" style="height:24px;width:24px;font-size:14px">×</button>'+
        '</div></div>';
    }
    return html+'</div>';
  }

  function dayTimeline(dayIdx){
    var all = ofDayFiltered(dayIdx);
    var rows = all.filter(function(x){ return x.type !== "habit"; });
    var habits = habitsHtml(dayIdx);
    if(!rows.length && !habits) return '<div class="empty">Libero</div>';
    var html = habits + '<div class="tl">';
    var now=nowHHMM(), shownNow=false, isTodayCol=iso(dateFor(dayIdx))===todayIso();
    for(var j=0;j<rows.length;j++){
      var x=rows[j];
      if(isTodayCol && !shownNow && x.time>now){ html += '<div class="nowbar">adesso<i></i>'+now+'</div>'; shownNow=true; }
      html += cardHtml(x, dayIdx);
    }
    if(isTodayCol && !shownNow && rows.length) html += '<div class="nowbar">adesso<i></i>'+now+'</div>';
    return html+'</div>';
  }

  function buildWeekBoard(){
    var curIso=todayIso(), html='<div class="pc-hint">Vista settimana · clicca un giorno per selezionarlo</div><div class="weekgrid">';
    var start = 0, end = 7;
    if(viewMode === "today"){ start = selected; end = selected+1; }
    for(var i=start;i<end;i++){
      var d=dateFor(i), isToday=iso(d)===curIso;
      html += '<div class="col'+(i===selected?" on":"")+(isToday?" today":"")+'" data-col="'+i+'">'+
        '<div class="colhead" data-day="'+i+'"><div class="dn">'+DAYS[i]+'</div><div class="dd">'+d.getDate()+' '+MESI[d.getMonth()]+'</div></div>'+
        dayTimeline(i)+'</div>';
    }
    return html+'</div>';
  }

  function speak(){
    var p=phrase(), wrap=$("ninoWrap");
    wrap.className="nino-wrap bob talking";
    if(!window.speechSynthesis){ setTimeout(function(){ wrap.className="nino-wrap bob"; },1600); return; }
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance((p.main+" "+(p.sub||"")).trim());
    u.lang="it-IT"; u.rate=1.02; u.pitch=1.18;
    u.onend=function(){ wrap.className="nino-wrap bob"; };
    speechSynthesis.speak(u);
  }

  function weekLabelForOff(off){
    if(off===0) return "questa sett.";
    if(off===1) return "prossima sett.";
    if(off===-1) return "sett. scorsa";
    if(off>1) return "tra "+off+" sett.";
    return (-off)+" sett. fa";
  }
  function fillDays(preferIso){
    var mon = thisMonday();
    var target = preferIso || iso(dateFor(selected));
    // settimana corrente prima, poi future, poi passate (se value fallisce resta sul giorno giusto)
    var order = [0];
    for(var wf=1; wf<=8; wf++) order.push(wf);
    for(var wp=-1; wp>=-4; wp--) order.push(wp);
    var html = "";
    var found = false;
    for(var oi=0; oi<order.length; oi++){
      var w = order[oi];
      html += '<optgroup label="'+weekLabelForOff(w)+'">';
      for(var i=0;i<7;i++){
        var d = new Date(mon.getTime());
        d.setDate(mon.getDate() + w*7 + i);
        d.setHours(12,0,0,0);
        var val = iso(d);
        var lab = DAYS[i]+" "+d.getDate()+"/"+(d.getMonth()+1);
        if(val === target){ html += '<option value="'+val+'" selected>'+lab+'</option>'; found = true; }
        else html += '<option value="'+val+'">'+lab+'</option>';
      }
      html += '</optgroup>';
    }
    if(!found && target){
      var extra = new Date(target+"T12:00:00");
      if(!isNaN(extra.getTime())){
        var di = extra.getDay(); di = di===0?6:di-1;
        html = '<optgroup label="giorno scelto"><option value="'+target+'" selected>'+DAYS[di]+" "+extra.getDate()+"/"+(extra.getMonth()+1)+'</option></optgroup>' + html;
        found = true;
      }
    }
    $("fDay").innerHTML = html;
    // forzatura su selectedIndex (più affidabile di .value con optgroup su mobile)
    var sel = $("fDay");
    sel.value = target;
    if(sel.value !== target){
      for(var k=0; k<sel.options.length; k++){
        if(sel.options[k].value === target){ sel.selectedIndex = k; break; }
      }
    }
  }
  function parseDaySelect(){
    // restituisce { dateStr, weekday, weekOffApprox }
    var val = $("fDay").value;
    if(/^\d{4}-\d{2}-\d{2}$/.test(val)){
      var d = new Date(val+"T12:00:00");
      var wd = d.getDay(); wd = wd===0?6:wd-1;
      return { dateStr: val, weekday: wd };
    }
    // legacy: indice 0-6 della settimana visualizzata
    var day = Number(val)||0;
    return { dateStr: iso(dateFor(day)), weekday: day };
  }
  function mark(group, attr, value){
    var all=$(group).querySelectorAll(".chip");
    for(var i=0;i<all.length;i++) all[i].className="chip"+(all[i].getAttribute(attr)===value?" on":"");
  }
  function findItem(id){ for(var i=0;i<items.length;i++) if(items[i].id===id) return items[i]; return null; }

  function checkFormConflict(){
    var parsed = parseDaySelect();
    var tStart = $("fTime").value||"09:00";
    var tEnd = $("fTimeEnd").value||addHour(tStart);
    var draft = { time:tStart, timeEnd:tEnd, type:pickType };
    if(pickType==="habit" || pickType==="assenza"){ $("conflictWarn").className="conflict-warn"; return; }
    // confronta con gli impegni che cadono in quella data assoluta
    var conf = null;
    for(var i=0;i<items.length;i++){
      var x = items[i];
      if(editId && x.id===editId) continue;
      if(!happensOn(x, parsed.weekday, parsed.dateStr)) continue;
      if(overlaps(draft, x)){ conf = x; break; }
    }
    if(conf){
      $("conflictWarn").textContent = "Si sovrappone a: "+conf.title+" ("+timeRangeInline(conf)+")";
      $("conflictWarn").className = "conflict-warn show";
    } else {
      $("conflictWarn").className = "conflict-warn";
    }
  }

  function createPrepTask(scadenzaItem){
    if(scadenzaItem.type !== "scadenza") return;
    var day = Number(scadenzaItem.weekday);
    if(scadenzaItem.rep && scadenzaItem.rep!=="none"){
      // for recurring deadline, prep on previous weekday of each occurrence is complex; skip auto for recurring
      return;
    }
    var d = new Date(scadenzaItem.date + "T12:00:00");
    d.setDate(d.getDate() - 1);
    var prepDate = iso(d);
    var already = items.some(function(x){
      return x.type==="task" && x.note && x.note.indexOf("Prep per: "+scadenzaItem.title)!==-1 && x.date===prepDate;
    });
    if(already) return;
    items.push({
      id: String(Date.now()+1),
      title: "Prepara: "+scadenzaItem.title,
      time: "09:00",
      timeEnd: "10:00",
      type: "task",
      rep: "none",
      urgente: true,
      weekday: (day+6)%7,
      date: prepDate,
      note: "Prep per: "+scadenzaItem.title,
      skips: [],
      doneDates: []
    });
  }

  function buildStats(){
    var reunMin=0, callMin=0, taskMin=0, absDays=0, scadTot=0, scadDone=0, habitTot=0, habitDone=0;
    for(var i=0;i<7;i++){
      var rows = ofDay(i);
      var dateStr = iso(dateFor(i));
      var dayAbs = false;
      for(var j=0;j<rows.length;j++){
        var x = rows[j];
        var mins = Math.round(durationHours(x)*60);
        if(x.type==="riunione") reunMin += mins;
        if(x.type==="call") callMin += mins;
        if(x.type==="task") taskMin += mins;
        if(x.type==="assenza") dayAbs = true;
        if(x.type==="scadenza"){ scadTot++; if(isDone(x,dateStr)) scadDone++; }
        if(x.type==="habit"){ habitTot++; if(isDone(x,dateStr)) habitDone++; }
      }
      if(dayAbs) absDays++;
    }
    var html = "<p><b>Riunioni:</b> "+Math.round(reunMin/60*10)/10+" h</p>";
    html += "<p><b>Call:</b> "+Math.round(callMin/60*10)/10+" h</p>";
    html += "<p><b>Task / focus:</b> "+Math.round(taskMin/60*10)/10+" h</p>";
    html += "<p><b>Giorni di assenza:</b> "+absDays+"</p>";
    html += "<p><b>Scadenze:</b> "+scadDone+"/"+scadTot+" completate</p>";
    html += "<p><b>Abitudini:</b> "+habitDone+"/"+habitTot+" fatte</p>";
    var loadAvg = 0;
    for(var k=0;k<5;k++) loadAvg += dayLoadHours(k);
    loadAvg = Math.round(loadAvg/5*10)/10;
    html += "<p><b>Carico medio Lun–Ven:</b> "+loadAvg+" h / "+WORK_HOURS+" h</p>";
    if(absDays) html += "<p style='color:#c43c3c'>Hai avuto "+absDays+" giorno/i fuori ufficio.</p>";
    else if(loadAvg >= 7) html += "<p style='color:#e08a16'>Settimana intensa: riposa un po'.</p>";
    else if(loadAvg < 3) html += "<p style='color:#0f7a4a'>Settimana leggera, bravo.</p>";
    else html += "<p style='color:var(--navy)'>Carico nella norma.</p>";
    return html;
  }

  $("prevW").onclick=function(){ weekOff--; render(); };
  $("nextW").onclick=function(){ weekOff++; render(); };
  $("weekLabel").onclick=function(){ weekOff=0; selected=todayIndex(); render(); };

  $("viewWeek").onclick=function(){ viewMode="week"; render(); };
  $("viewToday").onclick=function(){ viewMode="today"; weekOff=0; selected=todayIndex(); render(); };

  $("filters").onclick=function(e){
    var b=e.target.closest("[data-filter]"); if(!b) return;
    typeFilter = b.getAttribute("data-filter");
    var chips = $("filters").querySelectorAll(".chip");
    for(var i=0;i<chips.length;i++) chips[i].className="chip"+(chips[i].getAttribute("data-filter")===typeFilter?" on":"");
    render();
  };
  $("searchBox").oninput=function(){ searchQ = this.value.replace(/^\s+|\s+$/g,""); render(); };

  $("days").onclick=function(e){
    var b=e.target; while(b && b!==this && !b.getAttribute("data-day")) b=b.parentNode;
    if(!b||!b.getAttribute||b.getAttribute("data-day")==null) return;
    selected=Number(b.getAttribute("data-day")); render();
  };

  $("list").onclick=function(e){
    var doneBtn=e.target.closest("[data-done]");
    var editBtn=e.target.closest("[data-edit]");
    var skipBtn=e.target.closest("[data-skip]");
    var delBtn=e.target.closest("[data-del]");
    var dupBtn=e.target.closest("[data-dup]");
    var snoozeBtn=e.target.closest("[data-snooze]");
    var habitCb=e.target.closest("[data-habit]");
    var col = e.target.closest("[data-col]");

    if(habitCb){
      var item=findItem(habitCb.getAttribute("data-habit"));
      if(!item) return;
      var dayIdx = Number(habitCb.getAttribute("data-day"));
      item.doneDates = toggleDate(item.doneDates, iso(dateFor(dayIdx)));
      persist(); render(); return;
    }
    if(col && !doneBtn && !editBtn && !skipBtn && !delBtn && !dupBtn && !snoozeBtn){
      selected = Number(col.getAttribute("data-col")); render(); return;
    }
    if(doneBtn){
      var item=findItem(doneBtn.getAttribute("data-done"));
      if(!item) return;
      var d = doneBtn.getAttribute("data-day");
      var dayIdx = d==null ? selected : Number(d);
      var dateStr = iso(dateFor(dayIdx));
      if(isDone(item, dateStr)){
        item.doneDates = toggleDate(item.doneDates, dateStr);
        setDoneNote(item, dateStr, "");
        persist(); render(); return;
      }
      pendingDone = { item:item, dayIdx:dayIdx };
      $("doneNote").value = "";
      $("doneSheet").className = "sheet show";
      return;
    }
    if(editBtn){
      var item=findItem(editBtn.getAttribute("data-edit"));
      if(item) openForm(item);
      return;
    }
    if(dupBtn){
      var item=findItem(dupBtn.getAttribute("data-dup"));
      if(!item) return;
      // apre il form precompilato come NUOVO impegno: puoi cambiare giorno/settimana
      openForm(item, true);
      return;
    }
    if(snoozeBtn){
      var item=findItem(snoozeBtn.getAttribute("data-snooze"));
      if(!item) return;
      var d = snoozeBtn.getAttribute("data-day");
      var dayIdx = d==null ? selected : Number(d);
      var dateStr = iso(dateFor(dayIdx));
      // skip today if recurring, or move one-off by 1 day
      if(item.rep && item.rep!=="none"){
        item.skips = item.skips || [];
        if(item.skips.indexOf(dateStr)===-1) item.skips.push(dateStr);
        // also create a one-off tomorrow
        var nextDay = (dayIdx + 1) % 7;
        var nextDate = dateFor(dayIdx);
        nextDate.setDate(nextDate.getDate()+1);
        items.push({
          id: String(Date.now()),
          title: item.title,
          time: item.time,
          timeEnd: item.timeEnd,
          type: item.type,
          rep: "none",
          urgente: !!item.urgente,
          weekday: nextDay,
          date: iso(nextDate),
          note: (item.note||"") + (item.note?" · ":"") + "Rimandato",
          skips: [],
          doneDates: []
        });
      } else {
        var nd = dateFor(dayIdx);
        nd.setDate(nd.getDate()+1);
        item.date = iso(nd);
        item.weekday = (dayIdx+1)%7;
        item.note = (item.note||"") + (item.note?" · ":"") + "Rimandato";
      }
      persist(); render();
      return;
    }
    if(skipBtn){
      var item=findItem(skipBtn.getAttribute("data-skip"));
      if(!item) return;
      var d = skipBtn.getAttribute("data-day");
      var dayIdx = d==null ? selected : Number(d);
      var day=iso(dateFor(dayIdx));
      item.skips = item.skips || [];
      if(item.skips.indexOf(day)===-1) item.skips.push(day);
      selected = dayIdx;
      persist(); render(); return;
    }
    if(delBtn){
      var id=delBtn.getAttribute("data-del");
      items=items.filter(function(x){ return x.id!==id; }); persist(); render();
    }
  };

  $("doneConfirm").onclick=function(){
    if(!pendingDone) return;
    var item = pendingDone.item;
    var dayIdx = pendingDone.dayIdx;
    var dateStr = iso(dateFor(dayIdx));
    item.doneDates = toggleDate(item.doneDates, dateStr);
    var note = $("doneNote").value.replace(/^\s+|\s+$/g,"");
    setDoneNote(item, dateStr, note);
    pendingDone = null;
    $("doneSheet").className = "sheet";
    persist(); render();
  };
  $("doneCancel").onclick=function(){ pendingDone=null; $("doneSheet").className="sheet"; };
  $("doneSheet").onclick=function(e){ if(e.target.id==="doneSheet"){ pendingDone=null; $("doneSheet").className="sheet"; } };

  $("statsBtn").onclick=function(){
    $("statsBody").innerHTML = buildStats();
    $("statsSheet").className = "sheet show";
  };
  $("statsClose").onclick=function(){ $("statsSheet").className="sheet"; };
  $("statsSheet").onclick=function(e){ if(e.target.id==="statsSheet") $("statsSheet").className="sheet"; };

  $("types").onclick=function(e){
    var b=e.target.closest("[data-type]"); if(!b) return;
    pickType=b.getAttribute("data-type");
    mark("types","data-type",pickType);
    var timeRow = $("timeRow");
    if(pickType==="habit"){
      timeRow.style.display = "none";
      $("fTime").required = false;
      $("fTimeEnd").required = false;
    } else {
      timeRow.style.display = "";
      $("fTime").required = true;
      $("fTimeEnd").required = true;
    }
    if(pickType==="assenza"){
      if(!$("fTitle").value) $("fTitle").value = "Assenza";
      $("fTime").value = WORK_START;
      $("fTimeEnd").value = WORK_END;
    }
    if(pickType==="habit" && !$("fTitle").value) $("fTitle").value = "";
    checkFormConflict();
  };
  $("prio").onclick=function(e){ var b=e.target.closest("[data-urg]"); if(!b) return; pickUrg=b.getAttribute("data-urg")==="1"; mark("prio","data-urg", pickUrg?"1":"0"); };
  $("reps").onclick=function(e){ var b=e.target.closest("[data-rep]"); if(!b) return; pickRep=b.getAttribute("data-rep"); mark("reps","data-rep",pickRep); };

  $("fTime").onchange=function(){
    var s = $("fTime").value || "09:00";
    var e = $("fTimeEnd").value;
    if(!e || e <= s) $("fTimeEnd").value = addHour(s);
    checkFormConflict();
  };
  $("fTimeEnd").onchange=checkFormConflict;
  $("fDay").onchange=checkFormConflict;

  function openForm(item, asCopy){
    var preferIso = null;
    if(item && !asCopy){
      if(item.rep && item.rep!=="none") preferIso = iso(dateFor(Number(item.weekday)));
      else preferIso = item.date || iso(dateFor(selected));
    } else if(item && asCopy){
      preferIso = iso(dateFor(selected));
    } else {
      // nuovo impegno: giorno selezionato, o oggi se siamo nella settimana corrente
      preferIso = (weekOff===0 && selected===todayIndex()) ? todayIso() : iso(dateFor(selected));
    }
    fillDays(preferIso);
    if(item){
      if(asCopy){
        editId = null;
        $("formTitle").textContent = "Copia impegno";
        $("saveBtn").textContent = "Salva copia";
        pickRep = "none";
      } else {
        editId = item.id;
        $("formTitle").textContent = "Modifica impegno";
        $("saveBtn").textContent = "Aggiorna";
        pickRep = item.rep || "none";
      }
      $("fTitle").value = item.title || "";
      $("fTime").value = item.time || "09:00";
      $("fTimeEnd").value = item.timeEnd || addHour(item.time || "09:00");
      $("fNote").value = item.note || "";
      pickType = item.type || "riunione";
      pickUrg = !!item.urgente;
    } else {
      editId = null;
      $("formTitle").textContent = "Nuovo impegno";
      $("saveBtn").textContent = "Salva";
      $("fTitle").value = "";
      $("fTime").value = "09:00";
      $("fTimeEnd").value = "10:00";
      $("fNote").value = "";
      pickType = "riunione";
      pickRep = "none";
      pickUrg = false;
    }
    // ripristina sempre il giorno scelto
    var selDay = $("fDay");
    selDay.value = preferIso;
    if(selDay.value !== preferIso){
      for(var si=0; si<selDay.options.length; si++){
        if(selDay.options[si].value === preferIso){ selDay.selectedIndex = si; break; }
      }
    }
    mark("types","data-type",pickType);
    mark("reps","data-rep",pickRep);
    mark("prio","data-urg", pickUrg?"1":"0");
    var timeRow = $("timeRow");
    if(pickType==="habit"){
      timeRow.style.display = "none";
      $("fTime").required = false;
      $("fTimeEnd").required = false;
    } else {
      timeRow.style.display = "";
      $("fTime").required = true;
      $("fTimeEnd").required = true;
    }
    checkFormConflict();
    $("sheet").className = "sheet show";
  }
  $("addBtn").onclick=function(){ openForm(null); };
  $("talkBtn").onclick=speak;
  $("sheet").onclick=function(e){ if(e.target.id==="sheet") $("sheet").className="sheet"; };

  $("form").onsubmit=function(e){
    if(e&&e.preventDefault) e.preventDefault();
    var title=$("fTitle").value.replace(/^\s+|\s+$/g,""); if(!title) return false;
    var parsed = parseDaySelect();
    var day = parsed.weekday;
    var dateStr = parsed.dateStr;
    var tStart = $("fTime").value||"09:00";
    var tEnd = $("fTimeEnd").value||addHour(tStart);
    if(pickType !== "habit" && tEnd < tStart) tEnd = addHour(tStart);
    if(pickType === "habit"){ tStart = ""; tEnd = ""; }
    var payload = {
      title:title, time:tStart, timeEnd:tEnd, type:pickType, rep:pickRep,
      urgente:!!pickUrg, weekday:day, date:dateStr,
      note:$("fNote").value.replace(/^\s+|\s+$/g,"")
    };
    if(editId){
      var cur=findItem(editId);
      if(cur){
        cur.title=payload.title; cur.time=payload.time; cur.timeEnd=payload.timeEnd; cur.type=payload.type;
        cur.rep=payload.rep; cur.urgente=payload.urgente; cur.weekday=payload.weekday; cur.date=payload.date; cur.note=payload.note;
        if(!cur.skips) cur.skips=[];
      }
      editId=null;
    } else {
      payload.id=String(Date.now()); payload.skips=[]; payload.doneDates=[];
      items.push(payload);
      if(payload.type === "scadenza" && payload.rep === "none") createPrepTask(payload);
    }
    // porta la vista alla settimana del giorno scelto
    var target = new Date(dateStr+"T12:00:00");
    var mon = thisMonday();
    var diffDays = Math.round((target - mon) / 86400000);
    weekOff = Math.floor(diffDays / 7);
    selected = ((diffDays % 7) + 7) % 7;
    persist(); $("sheet").className="sheet"; render(); return false;
  };
  try { render(); } catch(err){ $("speech").textContent="Errore: "+err.message; }
})();
</script>
