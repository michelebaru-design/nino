<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nino Lavoro">
  <meta name="theme-color" content="#143056">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Nino Lavoro</title>
  <style>
    :root {
      --navy:#143056; --blue:#2b6fe0; --ink:#12203a; --muted:#5b6b86; --bad:#c43c3c;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; }
    body {
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color:var(--ink); background:#d9e4f4; overflow:hidden;
    }
    .app {
      max-width:480px; margin:0 auto; height:100%;
      display:flex; flex-direction:column;
      background: linear-gradient(#17345f 0 210px, #d9e4f4 210px);
      padding: calc(10px + var(--safe-t)) 12px calc(10px + var(--safe-b));
    }
    header { display:flex; justify-content:space-between; align-items:center; color:#fff; }
    .brand { font-weight:800; font-size:17px; letter-spacing:-.03em; }
    .brand span { opacity:.72; font-weight:700; }
    .week { font-size:12px; opacity:.8; font-weight:600; }
    .hero { display:flex; align-items:flex-end; gap:6px; margin:2px 0 8px; min-height:188px; }
    .nino-wrap { width:168px; flex:0 0 168px; }
    .nino { width:168px; height:188px; display:block; }
    .bubble {
      flex:1; background:#fff; border-radius:18px 18px 18px 8px;
      padding:12px 13px; min-height:96px; margin-bottom:18px;
      box-shadow:0 10px 24px rgba(0,0,0,.12); position:relative;
    }
    .bubble:before {
      content:""; position:absolute; left:-8px; bottom:28px;
      border:8px solid transparent; border-right-color:#fff; border-left:0;
    }
    .who { font-size:11px; font-weight:800; color:var(--blue); text-transform:uppercase; letter-spacing:.04em; }
    .say { margin:5px 0 0; font-size:15px; line-height:1.35; font-weight:650; }
    .say small { display:block; margin-top:6px; color:var(--muted); font-weight:500; font-size:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:8px; }
    .stat { background:#fff; border-radius:14px; padding:8px; text-align:center; }
    .stat b { display:block; font-size:18px; }
    .stat span { font-size:10px; color:var(--muted); font-weight:800; letter-spacing:.03em; }
    .actions { display:flex; gap:8px; margin-bottom:8px; }
    button { font:inherit; border:0; cursor:pointer; }
    .btn { flex:1; background:var(--blue); color:#fff; border-radius:14px; padding:12px 8px; font-weight:750; font-size:14px; }
    .btn.ghost { background:#fff; color:var(--navy); }
    .days { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:8px; }
    .day { background:#fff; border-radius:13px; padding:7px 0 6px; text-align:center; }
    .day.on { background:var(--navy); color:#fff; }
    .day .dn { font-size:10px; font-weight:800; opacity:.65; }
    .day .dd { font-size:14px; font-weight:800; }
    .day .dot { width:5px; height:5px; border-radius:50%; margin:4px auto 0; background:transparent; }
    .day.has .dot { background:#ffd15a; }
    .day.on.has .dot { background:#fff; }
    .board { flex:1; overflow:auto; background:#fff; border-radius:20px; padding:12px 10px 16px; }
    .empty { text-align:center; color:var(--muted); padding:36px 12px; font-weight:600; }
    .row { display:grid; grid-template-columns:52px 14px 1fr; gap:0 8px; min-height:64px; }
    .hh { font-weight:800; color:var(--navy); font-size:13px; padding-top:2px; }
    .rail { position:relative; }
    .rail:before { content:""; position:absolute; left:5px; top:10px; bottom:-8px; width:2px; background:#d7e2f2; }
    .row:last-child .rail:before { display:none; }
    .dotline { width:12px; height:12px; border-radius:50%; background:var(--blue); border:3px solid #d7e6ff; margin-top:3px; position:relative; z-index:1; }
    .dotline.scadenza { background:#e08a16; border-color:#ffe0bd; }
    .dotline.call { background:#1f9d6a; border-color:#cfeedf; }
    .dotline.task { background:#6b3cc3; border-color:#eadbff; }
    .card { background:#f5f8fd; border-radius:14px; padding:9px 10px; margin-bottom:8px; }
    .now .card { outline:2px solid var(--blue); background:#eef4ff; }
    .title { font-weight:750; font-size:15px; padding-right:78px; }
    .meta { color:var(--muted); font-size:12px; margin-top:3px; }
    .tag { display:inline-block; font-size:10px; font-weight:800; padding:2px 6px; border-radius:999px; margin-right:4px; }
    .t-riunione { background:#e7efff; color:#1d4fbf; }
    .t-scadenza { background:#ffe8d6; color:#b35400; }
    .t-call { background:#e7f8ef; color:#0f7a4a; }
    .t-task { background:#f1e9ff; color:#6b3cc3; }
    .rep { font-size:10px; font-weight:800; color:var(--blue); }
    .acts { float:right; display:flex; gap:4px; margin:-2px 0 0; }
    .del, .skip {
      height:28px; border-radius:9px; background:#fff; font-size:11px; font-weight:800; padding:0 8px;
    }
    .del { color:var(--bad); width:28px; padding:0; font-size:16px; }
    .skip { color:var(--navy); }
    .nowbar { grid-column:1 / -1; display:flex; align-items:center; gap:8px; color:#c43c3c; font-size:11px; font-weight:800; margin:2px 0 8px; }
    .nowbar i { flex:1; height:2px; background:#f3c4c4; display:block; }
    .sheet { position:fixed; inset:0; background:rgba(8,16,32,.45); display:none; align-items:flex-end; justify-content:center; z-index:20; }
    .sheet.show { display:flex; }
    .panel { width:min(480px,100%); background:#fff; border-radius:24px 24px 0 0; padding:16px 16px calc(16px + var(--safe-b)); max-height:92%; overflow:auto; }
    .grab { width:40px; height:5px; background:#d7deea; border-radius:99px; margin:0 auto 12px; }
    h2 { margin:0 0 8px; font-size:18px; }
    label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 6px; }
    input, select, textarea { width:100%; font:inherit; border:1.5px solid #dbe4f3; border-radius:14px; padding:12px; background:#f7faff; outline:none; }
    textarea { min-height:64px; resize:none; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .types, .reps { display:grid; gap:6px; }
    .types { grid-template-columns:repeat(4,1fr); }
    .reps { grid-template-columns:repeat(4,1fr); }
    .chip { background:#f3f6fb; border-radius:12px; padding:9px 4px; font-size:11px; font-weight:800; }
    .chip.on { background:var(--navy); color:#fff; }
    .save { width:100%; margin-top:14px; }
    .bob { animation:bob 2.8s ease-in-out infinite; transform-origin:50% 100%; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    .blink { animation:blink 4.6s infinite; }
    @keyframes blink { 0%,92%,100%{transform:scaleY(1)} 94%{transform:scaleY(.08)} }
    .talking .mouth { animation:talk .26s infinite alternate; }
    @keyframes talk { from{transform:scaleY(.45)} to{transform:scaleY(1.2)} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Nino <span>Lavoro</span></div>
      <div class="week" id="weekLabel"></div>
    </header>
    <section class="hero">
      <div class="nino-wrap bob" id="ninoWrap">
        <svg class="nino" viewBox="0 0 200 230" aria-hidden="true">
          <ellipse cx="100" cy="222" rx="54" ry="7" fill="#0b1b33" opacity=".22"/>
          <rect x="72" y="188" width="18" height="26" rx="6" fill="#1a2a44"/>
          <rect x="110" y="188" width="18" height="26" rx="6" fill="#1a2a44"/>
          <rect x="68" y="208" width="26" height="10" rx="4" fill="#0e1726"/>
          <rect x="106" y="208" width="26" height="10" rx="4" fill="#0e1726"/>
          <path d="M58 128 C58 118 70 112 100 112 C130 112 142 118 142 128 L148 188 C148 196 140 200 100 200 C60 200 52 196 52 188 Z" fill="#1c3358"/>
          <path d="M86 120 L100 168 L114 120 Z" fill="#f4f7fb"/>
          <path d="M100 124 L94 148 L100 144 L106 148 Z" fill="#c43c3c"/>
          <path d="M86 120 L100 132 L114 120" fill="none" stroke="#d7dee8" stroke-width="2"/>
          <rect x="42" y="128" width="20" height="52" rx="10" fill="#1c3358"/>
          <rect x="138" y="128" width="20" height="52" rx="10" fill="#1c3358"/>
          <circle cx="52" cy="182" r="9" fill="#2b6fe0"/>
          <circle cx="148" cy="182" r="9" fill="#2b6fe0"/>
          <circle cx="100" cy="78" r="50" fill="#2b6fe0"/>
          <ellipse cx="100" cy="96" rx="28" ry="16" fill="#fff"/>
          <path d="M62 60 C78 38 122 38 138 60" fill="none" stroke="#16325c" stroke-width="7" stroke-linecap="round"/>
          <rect x="68" y="68" width="26" height="18" rx="6" fill="none" stroke="#0e1726" stroke-width="3"/>
          <rect x="106" y="68" width="26" height="18" rx="6" fill="none" stroke="#0e1726" stroke-width="3"/>
          <path d="M94 77 H106" stroke="#0e1726" stroke-width="3"/>
          <g class="blink" style="transform-origin:81px 77px"><circle cx="81" cy="77" r="5.2" fill="#1a2438"/><circle cx="79" cy="75" r="1.6" fill="#fff"/></g>
          <g class="blink" style="transform-origin:119px 77px"><circle cx="119" cy="77" r="5.2" fill="#1a2438"/><circle cx="117" cy="75" r="1.6" fill="#fff"/></g>
          <ellipse cx="100" cy="92" rx="6.5" ry="5" fill="#e85b5b"/>
          <ellipse class="mouth" cx="100" cy="108" rx="8" ry="5" fill="#1a2438"/>
          <rect x="118" y="142" width="10" height="8" rx="1" fill="#ffd15a"/>
        </svg>
      </div>
      <div class="bubble">
        <div class="who">Nino · in giacca</div>
        <div class="say" id="speech">Preparo la timeline…</div>
      </div>
    </section>
    <div class="stats">
      <div class="stat"><b id="sToday">0</b><span>OGGI</span></div>
      <div class="stat"><b id="sWeek">0</b><span>SETTIMANA</span></div>
      <div class="stat"><b id="sDead">0</b><span>SCADENZE</span></div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="talkBtn">Briefing</button>
      <button type="button" class="btn ghost" id="addBtn">+ Impegno</button>
    </div>
    <div class="days" id="days"></div>
    <div class="board" id="list"></div>
  </div>
  <div class="sheet" id="sheet">
    <form class="panel" id="form" action="javascript:void(0)">
      <div class="grab"></div>
      <h2>Impegno di lavoro</h2>
      <label>Tipo</label>
      <div class="types" id="types">
        <button type="button" class="chip on" data-type="riunione">Riunione</button>
        <button type="button" class="chip" data-type="call">Call</button>
        <button type="button" class="chip" data-type="scadenza">Scadenza</button>
        <button type="button" class="chip" data-type="task">Task</button>
      </div>
      <label>Cosa</label>
      <input id="fTitle" required maxlength="90" placeholder="Es. standup, report, call cliente">
      <div class="row2">
        <div><label>Giorno</label><select id="fDay"></select></div>
        <div><label>Ora</label><input id="fTime" type="time" value="09:30" required></div>
      </div>
      <label>Ricorrenza</label>
      <div class="reps" id="reps">
        <button type="button" class="chip on" data-rep="none">Solo quel giorno</button>
        <button type="button" class="chip" data-rep="weekly">Ogni settimana</button>
        <button type="button" class="chip" data-rep="weekdays">Lun-Ven</button>
        <button type="button" class="chip" data-rep="daily">Tutti i giorni</button>
      </div>
      <label>Nota</label>
      <textarea id="fNote" maxlength="160" placeholder="Sala, link, persone…"></textarea>
      <button class="btn save" type="submit">Salva</button>
    </form>
  </div>
<script>
(function () {
  var DAYS = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
  var DAYS_LONG = ["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
  var LABELS = { riunione:"Riunione", call:"Call", scadenza:"Scadenza", task:"Task" };
  var REPS = { none:"una tantum", weekly:"ogni settimana", weekdays:"lun-ven", daily:"tutti i giorni" };
  var KEY = "nino-lavoro-v2";
  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?"0":"")+n; }
  function todayIndex(){ var d=new Date().getDay(); return d===0?6:d-1; }
  function monday(){ var d=new Date(); var day=d.getDay(); d.setDate(d.getDate()+(day===0?-6:1-day)); d.setHours(12,0,0,0); return d; }
  function dateFor(i){ var m=monday(); m.setDate(m.getDate()+i); return m; }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function load(){ try{ var x=JSON.parse(localStorage.getItem(KEY)||"[]"); return x instanceof Array?x:[]; }catch(e){ return []; } }
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function nowHHMM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
  function skipped(item, dateStr){
    var s = item.skips || [];
    for(var i=0;i<s.length;i++) if(s[i]===dateStr) return true;
    return false;
  }
  var selected = todayIndex();
  var items = load();
  var pickType = "riunione";
  var pickRep = "none";
  function happensOn(item, dayIdx, dateStr){
    if(skipped(item, dateStr)) return false;
    var r = item.rep || "none";
    if(r==="daily") return true;
    if(r==="weekdays") return dayIdx <= 4;
    if(r==="weekly") return Number(item.weekday) === dayIdx;
    return item.date === dateStr;
  }
  function ofDay(dayIdx){
    var dateStr = iso(dateFor(dayIdx));
    return items.filter(function(x){ return happensOn(x, dayIdx, dateStr); })
      .sort(function(a,b){ return String(a.time).localeCompare(String(b.time)); });
  }
  function uniqueWeekCount(){ var n=0; for(var i=0;i<7;i++) n += ofDay(i).length; return n; }
  function weekDead(){
    var n=0; for(var i=0;i<7;i++) ofDay(i).forEach(function(x){ if(x.type==="scadenza") n++; }); return n;
  }
  function phrase(){
    var today=todayIndex(), rows=ofDay(selected), todayRows=ofDay(today);
    var weekN=uniqueWeekCount(), dead=weekDead(), isToday=selected===today;
    if(!items.length) return { main:"Nessun impegno in archivio. Carichiamo la prima riunione?", sub:"Puoi farla ripetere, o saltare solo un giorno." };
    if(isToday && !todayRows.length) return { main:"Oggi l’agenda è libera.", sub: weekN+" cose in settimana"+(dead?(", "+dead+" scadenze."):".") };
    if(!rows.length) return { main:"Niente in timeline per "+DAYS_LONG[selected]+".", sub: todayRows.length?("Oggi invece hai "+todayRows.length+" impegni."):("In settimana risultano "+weekN+" slot.") };
    var first=rows[0];
    var label=isToday?"Oggi":(DAYS_LONG[selected].charAt(0).toUpperCase()+DAYS_LONG[selected].slice(1));
    if(rows.length===1) return { main: label+" in agenda alle "+first.time+": "+first.title+".", sub: (LABELS[first.type]||"")+(first.rep && first.rep!=="none"?" · "+REPS[first.rep]:"") };
    return { main: label+" hai "+rows.length+" impegni, dal "+rows[0].time+" al "+rows[rows.length-1].time+".", sub: rows.map(function(x){ return x.time+" "+x.title; }).join(", ")+"." };
  }
  function nearestId(rows){
    if(selected!==todayIndex() || !rows.length) return null;
    var now=nowHHMM(), next=null;
    for(var i=0;i<rows.length;i++) if(rows[i].time>=now){ next=rows[i].id; break; }
    return next || rows[rows.length-1].id;
  }
  function render(){
    var a=dateFor(0), b=dateFor(6);
    $("weekLabel").textContent = a.getDate()+"/"+(a.getMonth()+1)+" – "+b.getDate()+"/"+(b.getMonth()+1);
    $("sToday").textContent = ofDay(todayIndex()).length;
    $("sWeek").textContent = uniqueWeekCount();
    $("sDead").textContent = weekDead();
    var p=phrase();
    $("speech").innerHTML = p.main+(p.sub?"<small>"+esc(p.sub)+"</small>":"");
    var days="";
    for(var i=0;i<7;i++){
      var d=dateFor(i);
      days += '<button type="button" class="day'+(i===selected?" on":"")+(ofDay(i).length?" has":"")+'" data-day="'+i+'"><div class="dn">'+DAYS[i]+'</div><div class="dd">'+d.getDate()+'</div><div class="dot"></div></button>';
    }
    $("days").innerHTML=days;
    var rows=ofDay(selected);
    if(!rows.length){ $("list").innerHTML='<div class="empty">Timeline vuota.<br>Nino aspetta il primo impegno.</div>'; return; }
    var focus=nearestId(rows), now=nowHHMM(), html='<div class="tl">', shownNow=false;
    for(var j=0;j<rows.length;j++){
      var x=rows[j];
      if(selected===todayIndex() && !shownNow && x.time>now){ html += '<div class="nowbar">adesso<i></i>'+now+'</div>'; shownNow=true; }
      var recurring = x.rep && x.rep!=="none";
      html += '<div class="row'+(focus===x.id?" now":"")+'"><div class="hh">'+esc(x.time)+'</div><div class="rail"><div class="dotline '+esc(x.type)+'"></div></div><div class="card">'+
        '<div class="acts">'+(recurring?'<button type="button" class="skip" data-skip="'+esc(x.id)+'">Salta oggi</button>':'')+
        '<button type="button" class="del" data-del="'+esc(x.id)+'">×</button></div>'+
        '<div class="title">'+esc(x.title)+'</div><div class="meta"><span class="tag t-'+esc(x.type)+'">'+esc(LABELS[x.type]||x.type)+'</span>'+
        (recurring?'<span class="rep">'+esc(REPS[x.rep])+'</span> ':'')+esc(x.note||"")+'</div></div></div>';
    }
    if(selected===todayIndex() && !shownNow) html += '<div class="nowbar">adesso<i></i>'+now+'</div>';
    $("list").innerHTML = html+"</div>";
  }
  function speak(){
    var p=phrase(), wrap=$("ninoWrap");
    wrap.className="nino-wrap bob talking";
    if(!window.speechSynthesis){ setTimeout(function(){ wrap.className="nino-wrap bob"; },1600); return; }
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance((p.main+" "+(p.sub||"")).trim());
    u.lang="it-IT"; u.rate=1.02; u.pitch=1.1;
    u.onend=function(){ wrap.className="nino-wrap bob"; };
    speechSynthesis.speak(u);
  }
  function fillDays(){
    var html=""; for(var i=0;i<7;i++) html += '<option value="'+i+'">'+DAYS[i]+" "+dateFor(i).getDate()+'</option>';
    $("fDay").innerHTML=html; $("fDay").value=String(selected);
  }
  function mark(group, attr, value){
    var all=$(group).querySelectorAll(".chip");
    for(var i=0;i<all.length;i++) all[i].className="chip"+(all[i].getAttribute(attr)===value?" on":"");
  }
  function findItem(id){ for(var i=0;i<items.length;i++) if(items[i].id===id) return items[i]; return null; }
  $("days").onclick=function(e){
    var b=e.target; while(b && b!==this && !b.getAttribute("data-day")) b=b.parentNode;
    if(!b||!b.getAttribute||b.getAttribute("data-day")==null) return;
    selected=Number(b.getAttribute("data-day")); render();
  };
  $("list").onclick=function(e){
    var skipBtn=e.target.closest("[data-skip]");
    var delBtn=e.target.closest("[data-del]");
    if(skipBtn){
      var item=findItem(skipBtn.getAttribute("data-skip"));
      if(!item) return;
      var day=iso(dateFor(selected));
      item.skips = item.skips || [];
      if(item.skips.indexOf(day)===-1) item.skips.push(day);
      persist(); render(); return;
    }
    if(delBtn){
      var id=delBtn.getAttribute("data-del");
      items=items.filter(function(x){ return x.id!==id; }); persist(); render();
    }
  };
  $("types").onclick=function(e){ var b=e.target.closest("[data-type]"); if(!b) return; pickType=b.getAttribute("data-type"); mark("types","data-type",pickType); };
  $("reps").onclick=function(e){ var b=e.target.closest("[data-rep]"); if(!b) return; pickRep=b.getAttribute("data-rep"); mark("reps","data-rep",pickRep); };
  $("addBtn").onclick=function(){
    fillDays(); $("form").reset(); $("fTime").value="09:30"; $("fDay").value=String(selected);
    pickType="riunione"; pickRep="none"; mark("types","data-type",pickType); mark("reps","data-rep",pickRep);
    $("sheet").className="sheet show";
  };
  $("talkBtn").onclick=speak;
  $("sheet").onclick=function(e){ if(e.target.id==="sheet") $("sheet").className="sheet"; };
  $("form").onsubmit=function(e){
    if(e&&e.preventDefault) e.preventDefault();
    var title=$("fTitle").value.replace(/^\s+|\s+$/g,""); if(!title) return false;
    var day=Number($("fDay").value);
    items.push({ id:String(Date.now()), title:title, time:$("fTime").value||"09:30", type:pickType, rep:pickRep, weekday:day, date:iso(dateFor(day)), note:$("fNote").value.replace(/^\s+|\s+$/g,""), skips:[] });
    selected=day; persist(); $("sheet").className="sheet"; render(); return false;
  };
  try { render(); } catch(err){ $("speech").textContent="Errore: "+err.message; }
})();
</script>
</body>
</html>
